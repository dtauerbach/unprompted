name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unprompted_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/unprompted_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Scripted bots drive a production build over HTTP. See evals/README.md.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unprompted_eval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/unprompted_eval_test
      # Not a secret: it keys IP hashes in a throwaway CI database.
      IP_HASH_SECRET: ci-eval-not-a-secret
      PORT: 3000
      EVAL_URL: http://localhost:3000
      # Lets the moderator scenarios run scripts/admin.ts against it.
      EVAL_DATABASE_URL: postgres://postgres:postgres@localhost:5432/unprompted_eval_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run build
      - name: Start the server
        run: |
          nohup npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "$EVAL_URL/v1" > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm run eval
      - if: always()
        run: cat server.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-transcript
          path: evals/out/
          if-no-files-found: ignore
