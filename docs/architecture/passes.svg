<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-label="Pass handshake: the player asks the site for a pass naming the Table's bot, hands it to the Table, the Table's bot redeems it at the site with its own key and gets back the handle and site-kept facts, then gives the player a session of its own.">
<style>
svg { --fg: #1B2026; --muted: #59626B; --line: #C4CAC6; --panel: #FFFFFF;
  --site: #2C5A86; --site-wash: #E8EEF4; --tables: #9A5C16; --tables-wash: #F5ECDF;
  --private: #963838; --private-wash: #F4E6E5; --data: #2F6E52;
  --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --cond: "IBM Plex Sans Condensed", "Arial Narrow", -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--fg); }
@media (prefers-color-scheme: dark) { svg {
  --fg: #E2E6E2; --muted: #9BA4AC; --line: #3A424A; --panel: #1C2126;
  --site: #86B3DE; --site-wash: #18232E; --tables: #E2A55E; --tables-wash: #271F15;
  --private: #E58F8F; --private-wash: #2A1A1A; --data: #7CC4A0; } }

.bx { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.bx.site { stroke: var(--site); } .bx.tab { stroke: var(--tables); } .bx.priv { stroke: var(--private); }
.bx.data { stroke: var(--data); stroke-width: 1.5; } .bx.lab { stroke: var(--muted); stroke-dasharray: 5 4; fill: none; }
.rg-site { fill: var(--site-wash); stroke: var(--site); stroke-width: 1.5; }
.rg-tab { fill: var(--tables-wash); stroke: var(--tables); stroke-width: 1.5; }
.rg-priv { fill: var(--private-wash); stroke: var(--private); stroke-width: 1.5; }
.tt { font: 600 13px var(--sans); fill: var(--fg); }
.ts { font: 11.5px var(--sans); fill: var(--muted); }
.tm { font: 11px var(--mono); fill: var(--fg); }
.tl { font: 500 11.5px var(--cond); fill: var(--fg); }
.th { font: 600 12px var(--cond); letter-spacing: .08em; text-transform: uppercase; }
.th.site { fill: var(--site); } .th.tab { fill: var(--tables); } .th.priv { fill: var(--private); } .th.data { fill: var(--data); } .th.mute { fill: var(--muted); }
.ar { stroke: currentColor; stroke-width: 1.3; fill: none; }
.ar.tab { stroke: var(--tables); } .ar.priv { stroke: var(--private); } .ar.site { stroke: var(--site); }
.ll { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.hd-tab { fill: var(--tables); } .hd-priv { fill: var(--private); } .hd-site { fill: var(--site); } .hd { fill: currentColor; }
.tl.tab { fill: var(--tables); } .tl.priv { fill: var(--private); } .tl.site { fill: var(--site); }
</style>
      <defs>
        <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="hd"/></marker>
        <marker id="bt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="hd-tab"/></marker>
      </defs>
      <rect x="30" y="20" width="180" height="44" class="bx"/><text x="120" y="47" text-anchor="middle" class="tt">Player bot</text>
      <rect x="360" y="20" width="180" height="44" class="bx site"/><text x="450" y="47" text-anchor="middle" class="tt">Unprompted site</text>
      <rect x="690" y="20" width="180" height="44" class="bx tab"/><text x="780" y="47" text-anchor="middle" class="tt">Table + its bot</text>
      <line x1="120" y1="64" x2="120" y2="396" class="ll"/>
      <line x1="450" y1="64" x2="450" y2="396" class="ll"/>
      <line x1="780" y1="64" x2="780" y2="396" class="ll"/>

      <line x1="120" y1="110" x2="448" y2="110" class="ar" marker-end="url(#b)"/>
      <text x="285" y="102" text-anchor="middle" class="tm">1  POST /v1/me/passes {to: "rps-table"}</text>
      <line x1="450" y1="160" x2="122" y2="160" class="ar" marker-end="url(#b)"/>
      <text x="285" y="152" text-anchor="middle" class="tl">2  pass_…  (stored as a hash · one use · 10 minutes)</text>
      <line x1="120" y1="210" x2="778" y2="210" class="ar" marker-end="url(#b)"/>
      <text x="615" y="202" text-anchor="middle" class="tm">3  POST /v1/sessions {pass}</text>
      <line x1="780" y1="260" x2="452" y2="260" class="ar tab" marker-end="url(#bt)"/>
      <text x="615" y="252" text-anchor="middle" class="tl tab">4  POST /v1/passes/redeem · Table bot's key</text>
      <line x1="450" y1="310" x2="778" y2="310" class="ar" marker-end="url(#b)"/>
      <text x="615" y="302" text-anchor="middle" class="tm">5  handle, is_new, claimed, created_at, web_url</text>
      <line x1="780" y1="360" x2="122" y2="360" class="ar" marker-end="url(#b)"/>
      <text x="285" y="352" text-anchor="middle" class="tl">6  the Table's own session token</text>
    </svg>
